

<canvas id="view"></canvas>

<div id="fx"></div>

<div id="hud">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="telemetry">
    <div class="row"><span class="k">OBSERVER DISTANCE</span><span class="v" id="t-dist">—</span></div>
    <div class="row"><span class="k">DISK INCLINATION</span><span class="v" id="t-inc">—</span></div>
    <div class="row"><span class="k">GEODESIC STEPS</span><span class="v" id="t-steps">—</span></div>
    <div class="row"><span class="k">RENDER PROFILE</span><span class="v" id="t-prof">—</span></div>
    <div class="row"><span class="k">FRAME RATE</span><span class="v" id="t-fps">—</span></div>
  </div>

  <div id="deck" class="ctl">
    <div class="deck-title"><span id="deck-mode">CINEMATIC SEQUENCE</span><button id="btn-deck-toggle" class="deck-toggle" type="button" aria-label="Toggle deck panel" aria-controls="deck" aria-pressed="true">−</button></div>
    <button id="btn-cine" class="btn wide active" aria-label="Toggle cinematic sequence" aria-pressed="true">▶ CINEMATIC SEQUENCE</button>
    <div class="grid2">
      <button id="btn-poster" class="btn" aria-label="Fly to poster view">POSTER 38°</button>
      <button id="btn-edge" class="btn" aria-label="Fly to edge-on view">EDGE-ON</button>
      <button id="btn-polar" class="btn" aria-label="Fly to polar view">POLAR</button>
      <button id="btn-close" class="btn" aria-label="Fly to close pass view">CLOSE PASS</button>
    </div>
    <div class="grid4">
      <button id="btn-orbit" class="btn" aria-label="Toggle auto orbit" aria-pressed="false">AUTO-ORBIT</button>
      <button id="btn-quality" class="btn" aria-label="Cycle render quality">CINE</button>
      <button id="btn-params" class="btn" aria-label="Toggle parameters panel" aria-pressed="false">PARAMS</button>
      <button id="btn-hud" class="btn active" aria-label="Toggle HUD" aria-pressed="true">HUD</button>
    </div>
    <button id="btn-sound" class="btn wide" aria-label="Toggle sound" aria-pressed="false">🔇 SOUND: OFF</button>
    <div id="deck-hint">1-4 VIEWS · C CINE · R ORBIT · P PARAMS · M SOUND · H HUD</div>
  </div>

  <div id="hint">DRAG ORBIT · SCROLL/PINCH ZOOM · C CINEMATIC · M SOUND · 1-4 VIEWS · P PARAMS · H HUD</div>
</div>

<div id="params" class="hidden ctl">
  <div class="p-head">
    <span class="p-title">PARAMETERS</span>
    <button id="btn-reset" class="btn" aria-label="Reset all parameters">RESET</button>
  </div>
  <div id="p-rows"></div>
</div>

<div id="toast" role="status"></div>

<div id="fatal">
  <div class="fatal-card">
    <div class="fatal-title" id="fatal-title">SIGNAL LOST</div>
    <div class="fatal-msg" id="fatal-msg"></div>
    <div class="fatal-btns">
      <button id="fatal-lower" class="btn">▼ LOWER QUALITY</button>
      <button id="fatal-retry" class="btn">↻ RETRY</button>
    </div>
  </div>
</div>

<noscript><div style="position:fixed;inset:0;background:#000;color:#7fdcff;display:flex;align-items:center;justify-content:center;font-family:monospace;letter-spacing:.2em;">JAVASCRIPT REQUIRED</div></noscript>

<script src="site-nav.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn-deck-toggle');
  var deck = document.getElementById('deck');
  if (!btn || !deck) return;
  btn.addEventListener('click', function () {
    var collapsed = deck.classList.toggle('collapsed');
    btn.textContent = collapsed ? '+' : '\u2212';
    btn.setAttribute('aria-pressed', collapsed ? 'false' : 'true');
  });
})();
</script>
<script type="module" src="js/main.js"></script>
