    <style>
        /* --- 1. 核心视觉变量 --- */
        :root {
            --primary-gold: #ffd700;
            --secondary-gold: #c5a059;
            --bg-dark: #050505;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --card-bg: rgba(20, 20, 20, 0.85);
            --border-color: rgba(255, 215, 0, 0.15);
        }

        @font-face {
            font-family: 'Kaiti';
            src: local("Kaiti"), local("STKaiti"), local("KaiTi"), local("楷体");
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.8;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }

        /* --- 2. 导航栏 (保持与其他页面一致) --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(100px);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 102;
            color: #fff;
            text-decoration: none;
        }

        .logo img {
            height: 70px;
            width: auto;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.3);
        }

        .logo span {
            font-size: 24px;
            letter-spacing: 4px;
            font-weight: 800;
            text-transform: uppercase;
        }.nav-links { display: flex; gap: 30px; }
        .nav-links a { font-size: 13px; font-weight: 600; color: #888; letter-spacing: 1px; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-gold); }

        /* 移动端菜单按钮 */
        .hamburger { display: none; cursor: pointer; width: 30px; height: 20px; position: relative; z-index: 102; }
        .hamburger span { display: block; width: 100%; height: 2px; background: #fff; position: absolute; transition: 0.3s; }
        .hamburger span:nth-child(1) { top: 0; }
        .hamburger span:nth-child(2) { top: 9px; }
        .hamburger span:nth-child(3) { top: 18px; }
        .hamburger.active span:nth-child(1) { top: 9px; transform: rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { top: 9px; transform: rotate(-45deg); }

        /* --- 3. 白皮书主体容器 --- */
        .doc-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 120pxpx 20px 100px;
            position: relative;
            z-index: 10;
        }

        /* 标题区 */
        .doc-header { text-align: center; margin-bottom: 60px; border-bottom: 1px solid var(--border-color); padding-bottom: 40px; }
        .doc-tag { 
            display: inline-block; background: var(--primary-gold); color: #000; 
            font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 2px; margin-bottom: 15px; 
            letter-spacing: 1px;
        }
        .doc-title { 
            font-family: "Kaiti", serif; font-size: 42px; color: var(--primary-gold); margin-bottom: 20px; 
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .doc-intro { font-size: 16px; color: var(--text-muted); max-width: 700px; margin: 0 auto; font-style: italic; }

        /* 章节通用样式 */
        .chapter { margin-bottom: 50px; background: var(--card-bg); padding: 40px; border-radius: 8px; border: 1px solid var(--border-color); }
        .chapter-title { 
            font-size: 24px; color: #fff; margin-bottom: 25px; border-left: 4px solid var(--primary-gold); 
            padding-left: 15px; display: flex; align-items: center;
        }
        .chapter-title span { color: var(--secondary-gold); font-size: 16px; margin-right: 10px; font-weight: normal; font-family: monospace; }
        
        h3 { font-size: 18px; color: var(--primary-gold); margin: 25px 0 15px; }
        p { margin-bottom: 15px; text-align: justify; color: #ccc; font-size: 16px; }
        ul { list-style: none; margin-bottom: 20px; }
        li { position: relative; padding-left: 20px; margin-bottom: 10px; color: #ccc; }
        li::before { content: "•"; color: var(--primary-gold); position: absolute; left: 0; }
        strong { color: #fff; font-weight: 600; }

        /* 特殊高亮块 - 核心逻辑 */
        .core-logic-box {
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(0,0,0,0));
            border: 1px dashed var(--primary-gold);
            padding: 30px; margin-bottom: 50px; border-radius: 8px;
            text-align: center;
        }
        .core-logic-text { font-size: 18px; color: #fff; font-weight: bold; }
        .core-logic-sub { color: var(--secondary-gold); margin-top: 10px; font-size: 14px; }

        /* 数据对比表格 */
        .data-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0;
            text-align: center;
        }
        .data-item { background: rgba(0,0,0,0.5); padding: 15px; border: 1px solid #333; border-radius: 4px; }
        .data-label { font-size: 12px; color: #888; margin-bottom: 5px; }
        .data-value { font-size: 20px; color: var(--primary-gold); font-weight: bold; font-family: monospace; }

        /* 漏斗模型列表 */
        .funnel-list .step { 
            border-bottom: 1px solid rgba(255,255,255,0.05); padding: 15px 0; display: flex; flex-direction: column; 
        }
        .funnel-list .step:last-child { border-bottom: none; }
        .funnel-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .funnel-price { color: var(--primary-gold); font-weight: bold; }

        /* 底部 CTA */
        .footer-cta { margin-top: 60px; text-align: center; }
        .cta-btn {
            display: inline-block; background: var(--primary-gold); color: #000;
            padding: 15px 40px; font-size: 16px; font-weight: bold; border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); letter-spacing: 1px;
        }
        .cta-btn:hover { background: #fff; box-shadow: 0 0 30px rgba(255, 255, 255, 0.5); }
        .quote { color: #888; margin-bottom: 30px; font-family: "Kaiti"; font-size: 20px; }

        /* 背景动画Canvas */
        #zen-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; pointer-events: none;}

        /* --- NEW: Demo Button Styles --- */
        .header-cta-box {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .demo-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 40px;
            border: 1px solid var(--primary-gold);
            border-radius: 50px;
            color: var(--primary-gold);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(255, 215, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .demo-btn:hover {
            background: var(--primary-gold);
            color: #000;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transform: translateY(-3px) scale(1.02);
            text-decoration: none;
        }

        .live-dot {
            width: 8px; height: 8px;
            background-color: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
            animation: pulse-green 2s infinite;
        }
        
        .demo-btn:hover .live-dot { background-color: #000; box-shadow: none; animation: none; }

        @keyframes pulse-green {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            header { padding: 20px; }
            .logo img { height: 40px; }
            .logo span { font-size: 18px; letter-spacing: 2px; }
            .hamburger { display: block; }
            .nav-links {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                background: rgba(0, 0, 0, 0.95);
                backdrop-filter: blur(100px);
                z-index: 101;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 40px;
                transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                display: flex;
            }
            .nav-links.active { transform: translateX(0); }
            .nav-links a {
                font-size: 24px;
                font-weight: 800;
                color: #fff;
                margin-left: 0;
            }

            .nav-links { 
                position: fixed; top: 0; right: 0; height: 100vh; width: 70%; 
                background: #111; flex-direction: column; padding: 120pxpx 40px; 
                transform: translateX(100%); transition: 0.3s; z-index: 101; border-left: 1px solid #333;
            }
            .nav-links.open { transform: translateX(0); }
            .hamburger { display: block; }
            
            .doc-wrapper { padding: 40px 15px 80px; }
            .doc-title { font-size: 30px; }
            .chapter { padding: 25px 20px; }
            .data-grid { grid-template-columns: 1fr; }
        }
